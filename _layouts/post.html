---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}{% if page.author %} · {{ page.author }}{% endif %}</p>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
  <p class="back-link"><a href="/blog/">&larr; Back to all posts</a></p>
</article>
